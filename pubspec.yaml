
name: studytrack
description: "Aplicación de organización académica StudyTrack."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: 7.2.0

  # Preferencias del usuario
  shared_preferences: ^2.5.6

  # Escáner QR
  mobile_scanner: ^7.4.2

  # Calendario e idioma
  table_calendar: ^3.3.0
  intl: ^0.20.3
  image_picker: ^1.2.4
  image: ^4.12.0
  flutter_local_notifications: 20.1.0
  flutter_timezone: 5.1.1
  timezone: 0.10.1
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  http: ^1.6.0
  latlong2: ^0.10.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/logo_studytrack.png
